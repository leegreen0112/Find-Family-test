<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Find Family Demo - 아바타 선택</title>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; text-align: center; padding: 40px; }
    h1 { color: #333; margin-bottom: 10px; }
    p.subtitle { color: #666; margin-bottom: 40px; }
    
    /* 아바타 카드 컨테이너 */
    .avatar-container { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
    
    /* 캐릭터 카드 스타일 */
    .avatar-card {
      background: white; border-radius: 15px; border: 3px solid transparent;
      width: 260px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer; transition: all 0.3s ease; text-align: left;
    }
    .avatar-card:hover { transform: translateY(-10px); border-color: #4CAF50; box-shadow: 0 8px 25px rgba(76,175,80,0.3); }
    
    .avatar-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
    .avatar-name { font-size: 1.4rem; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
    .avatar-info { font-size: 0.9rem; color: #555; line-height: 1.5; }
    .badge { display: inline-block; padding: 4px 8px; font-size: 0.8rem; border-radius: 5px; background: #e0f2fe; color: #0284c7; font-weight: bold; margin-bottom: 10px; }
    
    /* 선택 후 결과 영역 */
    #scenario-result { margin-top: 40px; padding: 20px; background: white; border-radius: 10px; display: none; }
  </style>
</head>
<body>

  <h1>🐾 Find Family AI 수색 가상 체험</h1>
  <p class="subtitle">AI 수색 시스템을 체험할 강아지 캐릭터를 선택해 주세요!</p>

  <div class="avatar-container">
    <!-- 캐릭터 1: 호두 -->
    <div class="avatar-card" onclick="selectAvatar('호두', '진돗개 / 남아', '황색 털, 오른쪽 귀에 점', '2시간 전 (강남역)')">
      <div class="badge">난이도: 쉬움</div>
      <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400" class="avatar-img" alt="호두">
      <div class="avatar-name">호두 🐶</div>
      <div class="avatar-info">
        • <b>품종/성별:</b> 진돗개 / 남아<br>
        • <b>특징:</b> 황색 털, 오른쪽 귀 작은 점<br>
        • <b>실종 시나리오:</b> 2시간 전 강남역
      </div>
    </div>

    <!-- 캐릭터 2: 초코 -->
    <div class="avatar-card" onclick="selectAvatar('초코', '푸들 / 여아', '갈색 곱슬머리, 빨간 스카프', '4시간 전 (여의도 한강공원)')">
      <div class="badge">난이도: 보통</div>
      <img src="https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400" class="avatar-img" alt="초코">
      <div class="avatar-name">초코 🐕</div>
      <div class="avatar-info">
        • <b>품종/성별:</b> 토이푸들 / 여아<br>
        • <b>특징:</b> 갈색 곱슬털, 빨간 스카프<br>
        • <b>실종 시나리오:</b> 4시간 전 한강공원
      </div>
    </div>

    <!-- 캐릭터 3: 코코 -->
    <div class="avatar-card" onclick="selectAvatar('코코', '허스키 / 남아', '회색/흰색 털, 오드아이', '1시간 전 (북한산 둘레길)')">
      <div class="badge">난이도: 심화</div>
      <img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=400" class="avatar-img" alt="코코">
      <div class="avatar-name">코코 🐩</div>
      <div class="avatar-info">
        • <b>품종/성별:</b> 시베리안 허스키 / 남아<br>
        • <b>특징:</b> 오드아이(양눈 색 다름)<br>
        • <b>실종 시나리오:</b> 1시간 전 북한산
      </div>
    </div>
  </div>

  <!-- 캐릭터 선택 시 하단에 뜨는 시나리오 영역 -->
  <div id="scenario-result">
    <h2 id="selected-title"></h2>
    <p id="selected-detail"></p>
    <button style="padding: 10px 20px; font-size: 1rem; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
      🚀 2단계: AI 제보 사진 검증 체험하기
    </button>
  </div>

  <script>
    function selectAvatar(name, info, feature, scenario) {
      document.getElementById('scenario-result').style.display = 'block';
      document.getElementById('selected-title').innerText = '🎯 [' + name + '] 캐릭터가 선택되었습니다!';
      document.getElementById('selected-detail').innerHTML = 
        '<b>기본 데이터 세팅 완료:</b><br>' +
        '• 기본 정보: ' + info + '<br>' +
        '• 시각 특징(Feature): ' + feature + '<br>' +
        '• 가상 실종 조건: ' + scenario;
    }
  </script>

</body>
</html>
